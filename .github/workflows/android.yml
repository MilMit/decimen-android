name: Android CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build APKs (Debug & Release)
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build-apks
          cp app/build/outputs/apk/debug/app-debug.apk build-apks/decimen-android-debug.apk
          cp app/build/outputs/apk/release/app-release.apk build-apks/decimen-android-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: decimen-android-debug
          path: build-apks/decimen-android-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: decimen-android-release
          path: build-apks/decimen-android-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-apks/decimen-android-release.apk
            build-apks/decimen-android-debug.apk
          generate_release_notes: true
